<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Scholarship System</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Admin Dashboard - Manage Applications</h2>
            <button onclick="logout()" class="btn btn-secondary">Logout</button>
        </div>
        
        <div id="stats" class="stats">
            <div class="stat-card">
                <h3>Total Applications</h3>
                <p id="totalCount">0</p>
            </div>
            <div class="stat-card">
                <h3>Pending</h3>
                <p id="pendingCount">0</p>
            </div>
            <div class="stat-card">
                <h3>Approved</h3>
                <p id="approvedCount">0</p>
            </div>
            <div class="stat-card">
                <h3>Rejected</h3>
                <p id="rejectedCount">0</p>
            </div>
        </div>
        
        <table id="applicationsTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>School</th>
                    <th>Program</th>
                    <th>GWA</th>
                    <th>Status</th>
                    <th>Submitted</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="applicationsBody">
                <tr>
                    <td colspan="8">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const user = JSON.parse(sessionStorage.getItem('user'));
        if (!user || user.role !== 'admin') {
            alert('Access denied. Admin only.');
            window.location.href = 'login.html';
        }
        
        function logout() {
            sessionStorage.removeItem('user');
            window.location.href = 'login.html';
        }
        
        async function loadApplications() {
            const response = await fetch('../api/controllers/admin.php?action=list');
            const result = await response.json();
            
            if (result.success) {
                const apps = result.applications;
                updateStats(apps);
                renderTable(apps);
            }
        }
        
        function updateStats(apps) {
            document.getElementById('totalCount').textContent = apps.length;
            document.getElementById('pendingCount').textContent = 
                apps.filter(a => a.status === 'pending').length;
            document.getElementById('approvedCount').textContent = 
                apps.filter(a => a.status === 'approved').length;
            document.getElementById('rejectedCount').textContent = 
                apps.filter(a => a.status === 'rejected').length;
        }
        
        function renderTable(apps) {
            const tbody = document.getElementById('applicationsBody');
            tbody.innerHTML = '';
            
            apps.forEach(app => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${app.id}</td>
                    <td>${app.full_name}<br><small>${app.email}</small></td>
                    <td>${app.school}</td>
                    <td>${app.program}</td>
                    <td>${app.gwa}</td>
                    <td>
                        <select onchange="updateStatus(${app.id}, this.value)">
                            <option value="pending" ${app.status === 'pending' ? 'selected' : ''}>Pending</option>
                            <option value="approved" ${app.status === 'approved' ? 'selected' : ''}>Approved</option>
                            <option value="rejected" ${app.status === 'rejected' ? 'selected' : ''}>Rejected</option>
                        </select>
                    </td>
                    <td>${new Date(app.submitted_at).toLocaleDateString()}</td>
                    <td>
                        <button onclick="viewApplication(${app.id})" class="btn btn-small">View</button>
                        <button onclick="deleteApplication(${app.id})" class="btn btn-small btn-danger">Delete</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }
        
        async function updateStatus(id, status) {
            const response = await fetch('../api/controllers/admin.php?action=update_status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, status })
            });
            
            const result = await response.json();
            if (result.success) {
                alert('Status updated!');
                loadApplications();
            } else {
                alert(result.message);
            }
        }
        
        async function deleteApplication(id) {
            if (!confirm('Are you sure you want to delete this application?')) return;
            
            const response = await fetch('../api/controllers/admin.php?action=delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id })
            });
            
            const result = await response.json();
            if (result.success) {
                alert('Application deleted!');
                loadApplications();
            } else {
                alert(result.message);
            }
        }
        
        function viewApplication(id) {
            // You can expand this to show full application details
            alert('View application details for ID: ' + id);
        }
        
        // Load applications on page load
        loadApplications();
    </script>
</body>
</html>
